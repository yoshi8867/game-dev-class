//   4단계에서 새로 생긴 것: 맨 아래쪽 "4단계: 방 종류" 부분 전체와,
//     방 종류 정하기(createRoom), 쓴 샘물 그리기(drawRoom), 샘물 보너스(recalc), 지도 색
// ---------------------------------------------------------------------
// 3단계: 보관함과 아이템  (2단계 "전투" 위에 덧붙임)
//   3단계에서 새로 생긴 것: 맨 아래쪽 "3단계: 보관함과 아이템" 부분 전체와,
//     치명타(hit), 상자 보상(checkChest), 손에 든 무기(drawWeapon), 바닥 아이템 줍기
// ---------------------------------------------------------------------
// 2단계: 전투  (1단계 "방과 이동" 위에 덧붙임)
//   1단계: 방 그리기 / 방향키로 걷기 / 문으로 옆 방 이동 / 던전 만들기 / 미니맵
//   2단계에서 새로 생긴 것: 맨 아래쪽 "2단계: 전투" 부분 전체와,
//     방 그리기의 잠긴 문, 걸을 수 있는 칸의 잠금 처리, 적이 쫓아오는 길찾기(findPath)
// =====================================================================
const DEBUG = false;                // false로 바꾸면 테스트용 키(M, G, K, Shift+1~3, I, F, $, B, H, N)가 꺼진다

// ----- 방의 크기와 문 위치 (단위: 타일 칸) -----
const T = 16;                       // 타일 한 칸 = 16px
const W = 18, H = 14;               // 방 전체 = 가로 18칸, 세로 14칸 (벽 포함)
const OY = 1;                       // 북문 아치를 그리려고 화면 위쪽에 1칸 여유
const DOORS = { n: [[8, 1], [9, 1]], s: [[8, 12], [9, 12]], w: [[0, 6], [0, 7]], e: [[17, 6], [17, 7]] }; // 문 칸
const FRONT = { n: [[8, 2], [9, 2]], s: [[8, 11], [9, 11]], w: [[1, 6], [1, 7]], e: [[16, 6], [16, 7]] }; // 문 바로 안쪽 칸
const OPPOSITE = { n: 's', s: 'n', e: 'w', w: 'e' };
const STEP = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
const isFloor = (x, y) => x >= 1 && x <= 16 && y >= 2 && y <= 11;

// ----- 그림 불러오기 -----
const IMG = {};
// 'extra/'로 시작하면 assets/extra 폴더(Kenney 방패), 아니면 0x72 그림
const img = name => IMG[name] || (IMG[name] = Object.assign(new Image(), { src: (name.startsWith('extra/') ? 'assets/' : 'assets/frames/') + name + '.png' }));
const anim = (base, t, ms = 140) => base + (Math.floor(t / ms) % ANIMS[base]);   // 시간에 맞는 프레임 이름
const tile = (c, name, x, y) => { const i = img(name); if (i.naturalWidth) c.drawImage(i, x * T, (y + OY) * T - (i.naturalHeight - 16)); };
// 칸 (x, y)의 바닥 가운데에 발을 딛고 서도록 그림을 그린다
const spr = (c, name, x, y) => { const i = img(name); if (i.naturalWidth) c.drawImage(i, Math.round(x * T + (T - i.naturalWidth) / 2), Math.round((y + OY + 1) * T - i.naturalHeight)); };

// ----- 장식물 -----
const BLOCKS = { column: 1, crate: 1, hole: 1, chest: 1, merchant: 1, goods: 1 };   // 지나갈 수 없는 것
const FLAT = { hole: 1, stairs: 1 };                                                 // 바닥에 납작하게 깔리는 것
const DECOR_IMG = { column: 'column', crate: 'crate', hole: 'hole', skull: 'skull', chest: 'chest_full_open_anim_f0', stairs: 'floor_stairs' };
const DECOR_ANIM = { merchant: 'dwarf_m_idle_anim_f', boss: 'big_demon_idle_anim_f' };
const GOODS = ['flask_big_red', 'flask_big_blue', 'weapon_golden_sword', 'flask_big_green', 'weapon_axe', 'flask_big_yellow'];
const WALL_IMG = { banner_red: 'wall_banner_red', banner_blue: 'wall_banner_blue', banner_green: 'wall_banner_green', banner_yellow: 'wall_banner_yellow', hole1: 'wall_hole_1', hole2: 'wall_hole_2', goo: 'wall_goo' };

// =====================================================================
// 던전 만들기
//   한 층은 5×5 칸 지도. 방은 플레이어가 처음 들어갈 때 만들어진다.
//   규칙: 방 개수 N(8~10)을 정해 두고, "아직 안 가 본 문"의 개수를 조절해서
//         다른 방을 모두 가 본 뒤에야 마지막 방(보스 방)에 들어가게 한다.
// =====================================================================
const MAP = 5;
let floorNo = 1, N = 0, rooms = {}, frontier = new Set(), here = null;
const key = (gx, gy) => gx + ',' + gy;
const pick = list => list[Math.floor(Math.random() * list.length)];

// (gx, gy) 둘레에서 아직 아무것도 없는 칸들의 방향
function freeDirs(gx, gy) {
  return Object.keys(STEP).filter(d => {
    const nx = gx + STEP[d][0], ny = gy + STEP[d][1];
    return nx >= 0 && ny >= 0 && nx < MAP && ny < MAP && !rooms[key(nx, ny)] && !frontier.has(key(nx, ny));
  });
}

function newFloor() {
  N = 8 + Math.floor(Math.random() * 3);
  rooms = {}; frontier = new Set();
  here = createRoom(2, 2, null);
}

// 새 방 만들기. from = 새 방에서 봤을 때 들어온 문의 방향
function createRoom(gx, gy, from) {
  frontier.delete(key(gx, gy));
  const count = Object.keys(rooms).length + 1;            // 이 방이 몇 번째 방인지
  const doors = {}; if (from) doors[from] = true;
  let type = count === 1 ? 'start' : pickRoomType(count);   // 4단계: 전투·보상·상인 중에서
  const stuck = frontier.size === 0 && freeDirs(gx, gy).length === 0;
  if (count === N || (stuck && count > 1)) {
    type = 'boss';
    N = count; // ponytail: 막다른 곳에 갇히면 방 개수를 줄여 여기를 보스 방으로. 5×5에 방 10개면 드물다
  } else {
    // 빈 칸이 많은 방향부터 문을 낸다 (나중에 막다른 곳에 갇히지 않게)
    const free = freeDirs(gx, gy).sort(() => Math.random() - .5)
      .sort((a, b) => freeDirs(gx + STEP[b][0], gy + STEP[b][1]).length - freeDirs(gx + STEP[a][0], gy + STEP[a][1]).length);
    const left = N - count - frontier.size;               // 아직 문을 안 만든 방의 수
    let k = Math.min(free.length, left, 1 + Math.floor(Math.random() * 3));
    if (frontier.size === 0) k = Math.max(k, Math.min(1, free.length)); // 안 가 본 문이 하나는 남아 있어야 한다
    for (const d of free.slice(0, k)) { doors[d] = true; frontier.add(key(gx + STEP[d][0], gy + STEP[d][1])); }
  }
  const room = { gx, gy, type, layout: pick(DESIGN.rooms[type]), doors };
  rooms[key(gx, gy)] = room;
  if (type === 'combat') setupCombat(room, from);           // 2단계: 전투 방 준비
  if (type === 'reward') setupReward(room);                 // 4단계: 보상 방
  if (type === 'shop') setupShop(room);                     // 4단계: 상인 방
  if (type === 'boss') setupBoss(room);                     // 5단계: 보스 방
  return room;
}

// =====================================================================
// 방 그리기
// =====================================================================
const screen = document.getElementById('screen'), ctx = screen.getContext('2d');
ctx.imageSmoothingEnabled = false;                          // 5단계: 커진 보스도 도트가 번지지 않게
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0) % 1000 / 1000;   // 칸마다 정해진 무작위 값

function drawRoom(c, room, t, actors) {
  const D = room.doors, L = room.layout;
  c.fillStyle = '#25131a'; c.fillRect(0, 0, screen.width, screen.height);
  // 바닥 (가끔 금 간 타일)
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)
    tile(c, hash(x, y) < DESIGN.variety ? 'floor_' + (2 + Math.floor(hash(y, x) * 7)) : 'floor_1', x, y);
  if (D.w) DOORS.w.forEach(([x, y]) => tile(c, 'floor_1', x, y));
  if (D.e) DOORS.e.forEach(([x, y]) => tile(c, 'floor_1', x, y));
  if (D.s) for (const x of [8, 9]) { tile(c, 'floor_1', x, 12); tile(c, 'floor_1', x, 13); }
  // 북쪽 벽 (북문 자리는 바닥)
  for (let x = 1; x < W - 1; x++) {
    if (D.n && (x === 8 || x === 9)) { tile(c, 'floor_1', x, 1); continue; }   // 문 칸 2개만 바닥, 그 너머는 어둠
    tile(c, 'wall_top_mid', x, 0); tile(c, 'wall_mid', x, 1);
  }
  // 남쪽 벽
  for (let x = 1; x < W - 1; x++) if (!(D.s && (x === 8 || x === 9))) { tile(c, 'wall_top_mid', x, 12); tile(c, 'wall_mid', x, 13); }
  if (D.s) { tile(c, 'wall_top_right', 7, 12); tile(c, 'wall_right', 7, 13); tile(c, 'wall_top_left', 10, 12); tile(c, 'wall_left', 10, 13); }
  // 동·서 벽 (위에서 내려다본 테두리)
  for (let y = 0; y < H - 1; y++) {
    if (!(D.w && (y === 6 || y === 7))) tile(c, y ? 'wall_outer_mid_left' : 'wall_outer_top_left', 0, y);
    if (!(D.e && (y === 6 || y === 7))) tile(c, y ? 'wall_outer_mid_right' : 'wall_outer_top_right', W - 1, y);
  }
  if (D.w) { tile(c, 'wall_outer_front_left', 0, 5); tile(c, 'wall_outer_top_left', 0, 7); }
  if (D.e) { tile(c, 'wall_outer_front_right', W - 1, 5); tile(c, 'wall_outer_top_right', W - 1, 7); }
  tile(c, 'wall_outer_front_left', 0, H - 1); tile(c, 'wall_outer_front_right', W - 1, H - 1);
  // 벽 장식과 샘물
  for (const w of L.wall) {
    if (w.k.startsWith('fountain')) {
      const color = w.k.split('_')[1];
      const used = (room.fountains || []).some(f => f.x === w.x && f.used);   // 4단계: 다 쓴 샘물은 멈추고 빛바램
      if (used) c.filter = 'grayscale(1) brightness(.75)';
      tile(c, 'wall_fountain_top_1', w.x, 0); tile(c, used ? `wall_fountain_mid_${color}_anim_f0` : anim(`wall_fountain_mid_${color}_anim_f`, t, 160), w.x, 1); tile(c, used ? `wall_fountain_basin_${color}_anim_f0` : anim(`wall_fountain_basin_${color}_anim_f`, t, 160), w.x, 2);
      c.filter = 'none';
    } else { tile(c, WALL_IMG[w.k], w.x, 1); if (w.k === 'goo') tile(c, 'wall_goo_base', w.x, 2); }
  }
  // 북문 (1단계에서는 항상 열려 있음)
  // 문 잠금: 북문은 나무문이 닫히고, 나머지는 가시가 솟는다
  const lock = lockLevel(room, t);
  if (D.n) { tile(c, 'doors_frame_top', 8, -1); tile(c, 'doors_frame_left', 7, 1); tile(c, 'doors_frame_right', 10, 1); tile(c, lock >= .5 ? 'doors_leaf_closed' : 'doors_leaf_open', 8, 1); }
  const spike = Math.round(lock * 3);
  if (spike > 0) for (const d of ['s', 'w', 'e']) if (D[d]) DOORS[d].forEach(([x, y]) => tile(c, 'floor_spikes_anim_f' + spike, x, y));
  // 바닥에 깔린 것 → 서 있는 것(장식물 + 캐릭터)을 y순으로 (아래쪽이 앞에 보이게)
  for (const o of L.decor) if (FLAT[o.k] && !(o.k === 'stairs' && room.variant === 'boss' && !room.stairsOpen)) spr(c, DECOR_IMG[o.k], o.x, o.y);   // 5단계: 계단은 보스를 잡아야 보인다
  const list = [
    ...L.decor.filter(o => !FLAT[o.k] && !(o.k === 'chest' && room.variant) && !(o.k === 'boss' && room.variant)).map(o => ({ y: o.y, draw: () => spr(c, o.k === 'goods' ? GOODS[(o.x + o.y) % GOODS.length] : DECOR_ANIM[o.k] ? anim(DECOR_ANIM[o.k], t) : DECOR_IMG[o.k], o.x, o.y) })),
    ...actors,
  ];
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());
}

// =====================================================================
// 걸을 수 있는 칸과 길찾기
// =====================================================================
function blockedCells(room) {
  const s = new Set();
  for (const o of room.layout.decor) if (BLOCKS[o.k]) s.add(key(o.x, o.y));
  for (const w of room.layout.wall) if (w.k.startsWith('fountain')) s.add(key(w.x, 2));   // 샘물 받침
  return s;
}
const doorAt = (room, x, y) => Object.keys(room.doors).find(d => DOORS[d].some(([a, b]) => a === x && b === y));
// noDoor: 적은 문 칸으로 못 나간다
function walkable(room, x, y, noDoor) {
  if (doorAt(room, x, y)) return !noDoor && !room.locked;   // 잠긴 문은 못 지나감
  return isFloor(x, y) && !room.blocked.has(key(x, y));
}
// 너비 우선 탐색(BFS): 시작 칸에서 가까운 칸부터 퍼져 나가며 목표까지 가장 짧은 길을 찾는다
// 목표가 상자·기둥처럼 못 서는 칸이면, 그 바로 옆 칸 중 가장 가까운 곳까지 간다
function findPath(room, sx, sy, gx, gy, noDoor) {
  const goalOk = walkable(room, gx, gy, noDoor);
  const arrived = (x, y) => goalOk ? x === gx && y === gy : Math.abs(x - gx) + Math.abs(y - gy) === 1;
  const prev = { [key(sx, sy)]: null }, queue = [[sx, sy]];
  while (queue.length) {
    const [x, y] = queue.shift();
    if (arrived(x, y)) {
      const path = []; let k = key(x, y);
      while (k) { path.unshift(k.split(',').map(Number)); k = prev[k]; }
      return path.slice(1);                                  // 지금 서 있는 칸은 빼고
    }
    for (const [dx, dy] of Object.values(STEP)) {
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (!(k in prev) && walkable(room, nx, ny, noDoor)) { prev[k] = key(x, y); queue.push([nx, ny]); }
    }
  }
  return null;                                               // 갈 수 없는 곳
}

// =====================================================================
// 주인공
// =====================================================================
const HERO = DESIGN.ui.hero;
const SPEED = 5;                                             // 1초에 5칸
const hero = { x: 8, y: 9, path: [], face: 1, moving: false };

// 방향키: 누르고 있는 동안 한 칸씩 계속 걷는다
const KEY_DIR = { ArrowUp: 'n', ArrowDown: 's', ArrowLeft: 'w', ArrowRight: 'e' };
const held = [];                                              // 누르고 있는 방향 (마지막에 누른 것이 맨 뒤)
document.addEventListener('keydown', e => {
  const d = KEY_DIR[e.key]; if (!d) return;
  e.preventDefault();                                         // 화면 스크롤 막기
  if (!held.includes(d)) held.push(d);
  hero.path.length = Math.min(hero.path.length, 1);           // 클릭으로 가던 길은 지금 칸까지만
});
document.addEventListener('keyup', e => { const i = held.indexOf(KEY_DIR[e.key]); if (i >= 0) held.splice(i, 1); });

function updateHero(dt) {
  if (!hero.path.length && held.length) {
    const d = held[held.length - 1], nx = hero.x + STEP[d][0], ny = hero.y + STEP[d][1];
    if (STEP[d][0]) hero.face = STEP[d][0];
    if (walkable(here, nx, ny)) hero.path = [[nx, ny]];
  }
  hero.moving = hero.path.length > 0;
  if (!hero.moving) return;
  const [tx, ty] = hero.path[0];
  const dx = tx - hero.x, dy = ty - hero.y, dist = Math.hypot(dx, dy), step = player.speed * dt;
  if (dx) hero.face = Math.sign(dx);
  if (dist <= step) {                                        // 다음 칸에 도착
    hero.x = tx; hero.y = ty; hero.path.shift();
    const d = doorAt(here, tx, ty);
    if (d) goThrough(d, tx, ty);
  } else { hero.x += dx / dist * step; hero.y += dy / dist * step; }
}

// 문을 지나 옆 방으로
function goThrough(dir, x, y) {
  hero.path = [];
  const fade = document.getElementById('fade');
  fade.style.opacity = 1;
  setTimeout(() => {
    const gx = here.gx + STEP[dir][0], gy = here.gy + STEP[dir][1];
    const back = OPPOSITE[dir];
    const idx = DOORS[dir].findIndex(([a, b]) => a === x && b === y);   // 2칸 문 중 몇 번째 칸으로 나갔는지
    [hero.x, hero.y] = FRONT[back][idx];                                // 반대쪽 문 안쪽 같은 줄에서 등장
    shots = [];
    here.floorItems = [];
    shopOpen = false; drawShop();                                                // 버린 아이템은 방을 나가면 사라진다
    here = rooms[key(gx, gy)] || createRoom(gx, gy, back);
    here.blocked = here.blocked || blockedCells(here);
    drawMinimap();
    fade.style.opacity = 0;
  }, 150);
}

const player = { hp: 100, maxHp: 100, atk: 10, gold: 0, cd: 1000, crit: 0, critMul: 1, knock: .35, reach: 1.7, speed: 5, bonusAtk: 0, bonusHp: 0 };   // cd = 공격 쿨타임(ms)
function drawHud() {
  let hpHtml;
  if (DESIGN.ui.hpStyle === 'hearts') {
    hpHtml = ''; for (let i = 0; i < player.maxHp / 20; i++) { const v = player.hp - i * 20; hpHtml += `<img src="assets/frames/ui_heart_${v >= 20 ? 'full' : v >= 10 ? 'half' : 'empty'}.png" alt="">`; }
  } else hpHtml = `<span class="hpbar"><i style="width:${player.hp / player.maxHp * 100}%"></i>${DESIGN.ui.hpStyle === 'barnum' ? `<em>${player.hp} / ${player.maxHp}</em>` : ''}</span>`;
  document.getElementById('hud').innerHTML = `${hpHtml}
    <span class="stat"><img src="assets/frames/weapon_knight_sword.png" alt="공격력"><b>${player.atk}</b></span>
    <span class="stat"><img src="assets/frames/coin_anim_f0.png" alt="금화"><b>${player.gold}</b></span>
    <span class="stat" style="color:#f0c040">${floorNo}층</span>${godMode ? '<span class="stat" style="color:#7cc48a">무적(G)</span>' : ''}`;
}

// 지도 그리기 (미니맵과 테스트용 전체 지도가 같이 씀)
const ROOM_COLOR = { start: '#7cc48a', combat: '#b9a89d', boss: '#e0484e', shop: '#f0c040', reward: '#4aa3ff' };
function drawMap(canvas, cell, showAll) {
  const gap = Math.max(3, cell / 3), size = MAP * (cell + gap) + gap;
  canvas.width = size; canvas.height = size + (showAll ? 58 : 0);
  const g = canvas.getContext('2d'), at = (gx, gy) => [gap + gx * (cell + gap), gap + gy * (cell + gap)];
  g.fillStyle = 'rgba(20,12,16,.8)'; g.fillRect(0, 0, canvas.width, canvas.height);
  // 문으로 이어진 길
  g.fillStyle = '#6a5a52';
  for (const r of Object.values(rooms)) for (const d of Object.keys(r.doors)) {
    const [x, y] = at(r.gx, r.gy), [dx, dy] = STEP[d];
    g.fillRect(x + cell / 2 - 1.5 + dx * cell / 2, y + cell / 2 - 1.5 + dy * cell / 2, 3 + Math.abs(dx) * gap, 3 + Math.abs(dy) * gap);
  }
  if (showAll || DESIGN.ui.minimap.showUnknown) for (const k of frontier) {
    const [x, y] = at(...k.split(',').map(Number));
    g.strokeStyle = '#8a7a72'; g.strokeRect(x + .5, y + .5, cell - 1, cell - 1);
    g.fillStyle = '#8a7a72'; g.font = `bold ${cell * .7}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', x + cell / 2, y + cell / 2 + 1);
  }
  for (const r of Object.values(rooms)) {
    const [x, y] = at(r.gx, r.gy);
    // 상인·보상 방은 미니맵에도 색
    g.fillStyle = r === here ? '#f08a4b' : showAll || r.type === 'shop' || r.type === 'reward' ? ROOM_COLOR[r.type] : '#b9a89d'; g.fillRect(x, y, cell, cell);
    if (showAll && r === here) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(x, y, cell, cell); g.lineWidth = 1; }
  }

    g.fillText(`방 ${made} / ${N}개 · 안 가 본 문 ${frontier.size}개 · ${boss ? '보스 방 도착' : `보스 방은 ${N}번째 방`}`, 8, size + 16);
    g.fillStyle = '#a3948b'; g.fillText('초록: 시작 · 회색: 전투 · 노랑: 상인 · 파랑: 보상', 8, size + 34); g.fillText('빨강: 보스 · 주황: 지금 있는 방 · ?: 아직 안 만든 방', 8, size + 52);
  }
}

// =====================================================================
// 2단계: 전투
//   적(근접형·원거리형·미믹), 좌클릭 공격(쿨타임 1초), 맞으면 무적+깜빡임,
//   전투 방 3종류(기본·매복·미믹), 전투 중 문 잠금, 다 잡으면 상자 열림, 사망
// =====================================================================
const MON = DESIGN.monsters, SP = DESIGN.spawn;
const INVULN = DESIGN.ui.invulnMs;        // 맞은 뒤 무적 시간 (ms)
const REACH = 1.7;                        // 공격 범위: 주인공 둘레 1.7칸 (옆 8칸보다 조금 넓다)
let lastAttack = -1e9, hurtAt = -1e9, godMode = false, gameOver = false;
let shots = [], floats = [], swing = null, sparks = [], lockedMsgAt = 0;

// 층 조합 글자("goblin*2 + imp*1")를 [{id:'goblin', n:2}, {id:'imp', n:1}]로 바꾼다
const combos = tier => SP.tiers[tier].split('\n').map(s => s.trim()).filter(Boolean)
  .map(line => line.split('+').map(p => { const [id, n] = p.split('*').map(s => s.trim()); return { id, n: +(n || 1) }; }));
const power = () => ({ hp: 1 + SP.hpUp / 100 * (floorNo - 1), atk: 1 + SP.atkUp / 100 * (floorNo - 1) });   // 층이 깊을수록 강해짐

function makeEnemy(id, x, y) {
  const m = MON[id], p = power();
  return { id, m, x, y, hp: Math.round(m.hp * p.hp), maxHp: Math.round(m.hp * p.hp), atk: Math.round(m.atk * p.atk),
    face: 1, path: [], repathAt: 0, hitAt: -1e9, wakeAt: performance.now() + 600, fireAt: performance.now() + 800 + Math.random() * 1200, moving: false };
}

function pickVariant() {
  const v = SP.variants, r = Math.random() * (v.normal + v.ambush + v.mimic);
  return r < v.normal ? 'normal' : r < v.normal + v.ambush ? 'ambush' : 'mimic';
}

// 전투 방 준비 (방이 처음 만들어질 때)
function setupCombat(room, from, variant) {
  room.blocked = blockedCells(room);
  const c = room.layout.decor.find(o => o.k === 'chest');
  room.variant = variant || pickVariant();
  if (!c && room.variant !== 'normal') room.variant = 'normal';        // 상자 없는 틀이면 기본 전투
  room.chest = c ? { x: c.x, y: c.y, opened: false, openAt: 0 } : null;
  room.enemies = []; room.state = 'idle'; room.locked = false; room.lockAt = -1e9; room.from = from;
  if (room.variant === 'normal') startFight(room, null);
}

// 적이 나타날 수 있는 칸
function spawnCells(room, around) {
  const cells = [], door = room.from ? FRONT[room.from][0] : [8.5, 6.5];
  for (let y = 2; y <= 11; y++) for (let x = 1; x <= 16; x++) {
    if (!walkable(room, x, y, true) || (room.chest && x === room.chest.x && y === room.chest.y)) continue;
    if (Math.hypot(x - hero.x, y - hero.y) < 3) continue;              // 주인공 바로 옆에는 안 나타남
    if (around) { const r = Math.max(Math.abs(x - around.x), Math.abs(y - around.y)); if (r < 2 || r > 4) continue; }
    else if (SP.rule === 'far' && Math.abs(x - door[0]) + Math.abs(y - door[1]) < 7) continue;
    else if (SP.rule === 'edge' && !(x <= 2 || x >= 15 || y <= 3 || y >= 10)) continue;
    cells.push([x, y]);
  }
  return cells;
}

function startFight(room, around) {
  const cells = spawnCells(room, around), taken = [];
  for (const p of pick(combos(Math.min(3, floorNo)))) for (let i = 0; i < p.n; i++) {
    const free = cells.filter(([x, y]) => taken.every(([a, b]) => Math.max(Math.abs(a - x), Math.abs(b - y)) >= 2));
    const c = pick(free.length ? free : cells); if (!c) break;
    taken.push(c); room.enemies.push(makeEnemy(p.id, c[0], c[1]));
  }
  lockRoom(room, true);
}

function lockRoom(room, on) { room.locked = on; room.lockAt = performance.now(); room.state = on ? 'fight' : 'clear'; }
const lockLevel = (room, t) => { const p = Math.min(1, (t - (room.lockAt ?? -1e9)) / (DESIGN.doors.spikeMs * 3)); return room.locked ? p : 1 - p; };

// 상자: 매복·미믹은 다가가면 발동, 전투가 끝난 상자는 옆에 서면 열림
function checkChest(room, t) {
  const c = room.chest; if (!c || c.opened) return;
  const d = Math.max(Math.abs(hero.x - c.x), Math.abs(hero.y - c.y));
  if (room.state === 'idle' && d <= SP.mimicReveal) {
    if (room.variant === 'ambush') { startFight(room, c); say('매복이다!', c.x, c.y - 1, '#ff6b6b'); }
    if (room.variant === 'mimic') {
      const e = makeEnemy('mimic', c.x, c.y); e.wakeAt = t + 400; room.enemies.push(e);
      room.blocked.delete(key(c.x, c.y)); room.chest = null;                 // 상자가 미믹이었다 → 보상 없음
      lockRoom(room, true); say('미믹이다!', c.x, c.y - 1, '#ff6b6b');
    }
  } else if (room.state === 'fight' && d <= 1 && t - lockedMsgAt > 1500) { lockedMsgAt = t; say('잠겨 있다', c.x, c.y - 1, '#a3948b'); }
  else if (room.state === 'clear' && d <= 1) {
    c.opened = true; c.openAt = t;
    const gold = Math.round((5 + Math.random() * 10) * (1 + (floorNo - 1) * .5));
    player.gold += gold; drawHud(); say(`+${gold} 금화`, c.x, c.y - 1, '#f0c040');
    const loot = rollLoot();                                                 // 3단계: 아이템도 나온다
    if (loot) { const left = addItem(loot.id, loot.count);
      if (left) { dropToFloor(loot.id, left, c.x, c.y); say('보관함이 가득 차서 바닥에 떨어졌다', c.x, c.y - 2, '#ff6b6b'); }
      else say(`${ITEMS[loot.id].name}${loot.count > 1 ? ' ×' + loot.count : ''}`, c.x, c.y - 2, DESIGN.ui.inv.rarity[ITEMS[loot.id].tier]); }
  }
}

// ----- 주인공의 공격 -----
// Z 키: 칼을 한 바퀴 휘둘러 범위(REACH) 안의 적을 모두 친다. 누르고 있으면 쿨타임마다 계속
let zHeld = false;
document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'z') zHeld = true; });
document.addEventListener('keyup', e => { if (e.key.toLowerCase() === 'z') zHeld = false; });
function updateAttack(t) {
  if (!zHeld || t - lastAttack < player.cd) return;
  lastAttack = t; swing = { at: t, dir: hero.face, start: restAngle() };   // 오른쪽을 보면 시계 방향, 왼쪽이면 반대
  for (const e of [...(here.enemies || [])]) if (here.enemies.includes(e) && Math.hypot(e.x - hero.x, e.y - hero.y) <= player.reach + (e.boss ? .6 * bossScale(e, t) : 0)) hit(e, t);   // 보스가 쓰러지면 졸개도 사라지므로 아직 있는지 확인   // 보스는 몸이 커서 조금 멀리서도 맞는다
}
function hit(e, t) {
  const crit = Math.random() < player.crit, dmg = Math.round(player.atk * (crit ? player.critMul : 1));   // 3단계: 치명타
  e.hp -= dmg; e.hitAt = t;
  sparks.push({ x: e.x, y: e.y, at: t, big: crit });
  say(crit ? `치명타! -${dmg}` : `-${dmg}`, e.x, e.y - 1, crit ? '#ffd23a' : '#fff');
  // 넉백: 맞은 반대쪽으로 0.15초 동안 player.knock칸만큼 미끄러진다
  const d = Math.hypot(e.x - hero.x, e.y - hero.y) || 1;
  const kb = player.knock * (e.boss ? .15 : 1);                          // 5단계: 보스는 거의 안 밀린다
  e.kvx = (e.x - hero.x) / d * kb / .15; e.kvy = (e.y - hero.y) / d * kb / .15; e.kbUntil = t + 150;
  if (e.hp <= 0) {
    here.enemies.splice(here.enemies.indexOf(e), 1);
    say('💨', e.x, e.y, '#fff');
    if (e.boss) bossDefeated(e, t);                                       // 5단계
    if (!here.enemies.length) { lockRoom(here, false); say('전투 끝!', 8.5, 5, '#7cc48a'); }
  }
}

// ----- 주인공이 맞음 -----
function hurt(dmg, t) {
  if (godMode || gameOver || t - hurtAt < INVULN) return;
  hurtAt = t; player.hp = Math.max(0, player.hp - dmg); drawHud();
  say(`-${dmg}`, hero.x, hero.y - 1, '#ff6b6b');
  if (player.hp <= 0) { gameOver = true; document.getElementById('over').style.display = 'grid'; }
}

// ----- 적의 움직임 -----
// 두 점 사이에 기둥·상자가 없으면 true (원거리 공격이 막히는지 확인)
function lineClear(room, x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 4);
  for (let i = 1; i < n; i++) { const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n); if (room.blocked.has(key(x, y))) return false; }
  return true;
}
function stepToward(e, tx, ty, dt) {
  const dx = tx - e.x, dy = ty - e.y, dist = Math.hypot(dx, dy), s = e.m.spd * dt;
  if (dist <= s) { e.x = tx; e.y = ty; return true; }
  e.x += dx / dist * s; e.y += dy / dist * s; return false;
}
const PROJ_COLOR = { imp: '#ff6040', orc_shaman: '#7cff6a', necromancer: '#c070ff', ice_zombie: '#7fe8ff' };
function updateEnemies(room, dt, t) {
  for (const e of room.enemies || []) {
    e.moving = false;
    if (t < (e.kbUntil || 0)) {                                             // 밀려나는 중 (벽·기둥에 닿으면 멈춤)
      const nx = e.x + e.kvx * dt, ny = e.y + e.kvy * dt;
      if (walkable(room, Math.round(nx), Math.round(ny), true)) { e.x = nx; e.y = ny; } else e.kbUntil = 0;
      continue;
    }
    if (e.boss) continue;                                                  // 5단계: 보스는 updateBoss가 움직인다
    if (t < e.wakeAt || t - e.hitAt < 200) continue;                       // 막 나타났거나 맞아서 움찔
    const dist = Math.hypot(hero.x - e.x, hero.y - e.y);
    if (hero.x !== e.x) e.face = Math.sign(hero.x - e.x);
    let move = true;
    if (e.m.role === 'ranged' && dist <= e.m.range && lineClear(room, e.x, e.y, hero.x, hero.y)) {
      move = false;                                                         // 사거리 안이면 서서 쏜다
      if (t >= e.fireAt) {
        e.fireAt = t + e.m.fire * 1000;
        shots.push({ x: e.x, y: e.y, vx: (hero.x - e.x) / dist * e.m.pspd, vy: (hero.y - e.y) / dist * e.m.pspd, atk: e.atk, color: PROJ_COLOR[e.id] || '#ffd040' });
      }
    }
    if (move) {
      e.moving = true;
      if (dist < 1.2) stepToward(e, hero.x, hero.y, dt);                   // 가까우면 곧장 들이받는다
      else {
        if (t >= e.repathAt) { e.repathAt = t + 300; e.path = findPath(room, Math.round(e.x), Math.round(e.y), Math.round(hero.x), Math.round(hero.y), true) || []; }
        if (e.path.length && stepToward(e, e.path[0][0], e.path[0][1], dt)) e.path.shift();
      }
    }
    if (dist < .75) hurt(e.atk, t);                                         // 몸으로 부딪힘
  }
  // 적끼리 겹치지 않게 살짝 밀어내기
  const es = room.enemies || [];
  for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
    const a = es[i], b = es[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0 && d < .7) { const p = (.7 - d) / 2, ux = (a.x - b.x) / d, uy = (a.y - b.y) / d; a.x += ux * p; a.y += uy * p; b.x -= ux * p; b.y -= uy * p; }
  }
}
function updateShots(dt, t) {
  shots = shots.filter(s => {
    if (s.until && t > s.until) return false;                                // 5단계: 유도탄은 시간이 지나면 사라진다
    if (s.turn) {                                                             // 5단계: 유도탄은 주인공 쪽으로 조금씩만 꺾인다
      const sp = Math.hypot(s.vx, s.vy), cur = Math.atan2(s.vy, s.vx);
      let want = Math.atan2(hero.y - s.y, hero.x - s.x) - cur; want = Math.atan2(Math.sin(want), Math.cos(want));
      const ang = cur + Math.max(-s.turn * dt, Math.min(s.turn * dt, want)); s.vx = Math.cos(ang) * sp; s.vy = Math.sin(ang) * sp;
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const cx = Math.round(s.x), cy = Math.round(s.y);
    if (!isFloor(cx, cy) || here.blocked.has(key(cx, cy))) return false;  // 벽·기둥에 막힘
    if (Math.hypot(s.x - hero.x, s.y - hero.y) < .45) { hurt(s.atk, t); return false; }
    return true;
  });
}

// ----- 떠오르는 글자 -----
function say(text, x, y, color) { floats.push({ text, x, y, color, at: performance.now() }); }
function drawFloats(t) {
  ctx.textAlign = 'center'; ctx.font = 'bold 8px sans-serif';
  floats = floats.filter(f => {
    const k = (t - f.at) / 900; if (k >= 1) return false;
    ctx.globalAlpha = 1 - k; ctx.fillStyle = '#000'; const px = (f.x + .5) * T, py = (f.y + OY + .5) * T - k * 10;
    ctx.fillText(f.text, px + .5, py + .5); ctx.fillStyle = f.color; ctx.fillText(f.text, px, py);
    ctx.globalAlpha = 1; return true;
  });
}

// ----- 게임 오버와 다시 시작 -----
function restart() {
  floorNo = 1; Object.assign(player, { hp: 100, maxHp: 100, atk: 10, gold: 0, bonusAtk: 0, bonusHp: 0 });
  shopOpen = false; drawShop(); banner = null;
  bag = Array(SLOTS).fill(null); recalc(); drawBag();
  gameOver = false; shots = []; floats = []; hurtAt = -1e9;
  newFloor(); here.blocked = here.blocked || blockedCells(here);
  Object.assign(hero, { x: 8, y: 9, path: [] });
  document.getElementById('over').style.display = 'none';
  drawHud(); drawMinimap();
}

document.addEventListener('keydown', e => {
  if (!DEBUG) return;
  const k = e.key.toLowerCase();
  if (k === 'g') { godMode = !godMode; drawHud(); }
  if (k === 'k' && here.enemies && here.enemies.length) { here.enemies = []; lockRoom(here, false); say('전투 끝!', 8.5, 5, '#7cc48a'); }
  const n = e.shiftKey && e.code.startsWith('Digit') ? e.code.slice(5) : null;   // 숫자 키는 음식 먹기라서 Shift+숫자
  if (['1', '2', '3'].includes(n) && here.type === 'combat') {

    say({ normal: '기본 전투', ambush: '매복 방', mimic: '미믹 방' }[v], 8.5, 5, '#f0c040');

});

// =====================================================================
// 3단계: 보관함과 아이템
//   하단 10칸 보관함, 음식 겹치기(최대 99), 숫자 키로 먹기, 드래그로 바꾸기·버리기,
//   정렬, 장비 효과(들고만 있어도 적용·모두 중첩), 치명타, 상자에서 아이템
// =====================================================================
const ITEMS = Object.fromEntries(DESIGN.items.map(it => [it.id, it]));
const TIER_NAME = { common: '일반', rare: '희귀', legend: '전설' };
const KIND_NAME = { weapon: '무기', armor: '방어구', gear: '장신구', food: '음식' };
// 아이템 효과 설명 한 줄
function fxText(it) {
  const p = [];
  if (it.atk) p.push(`공격력 +${it.atk}`);
  if (it.kind === 'weapon') p.push('쿨타임 ×0.7');
  if (it.crit) p.push(`치명타 ${Math.round(it.crit * 100)}% ×${it.critMul}`);
  if (it.knock) p.push(`넉백 +${it.knock}칸`);
  if (it.range) p.push(`베기 범위 +${it.range}칸`);
  if (it.speed) p.push(`이동 속도 ×${it.speed}`);
  if (it.hp) p.push(`최대 체력 +${it.hp}`);
  if (it.heal) p.push(`체력 +${it.heal} 회복`);
  return p.join(' · ');
}

const SLOTS = 10, STACK = 99;
const EAT_CD = 2000;                          // 음식을 먹은 뒤 2초 동안은 못 먹는다
let lastEat = -1e9;
let bag = Array(SLOTS).fill(null);            // 보관함: 칸마다 { id, count } 또는 null

// 보관함에 넣기. 다 못 넣으면 남은 개수를 돌려준다 (0이면 다 들어감)
function addItem(id, count = 1) {
  const it = ITEMS[id];
  if (it.kind === 'food') {
    for (const s of bag) if (s && s.id === id && s.count < STACK) { const mv = Math.min(STACK - s.count, count); s.count += mv; count -= mv; }
  }
  while (count > 0) {
    const i = bag.indexOf(null); if (i < 0) break;                           // 왼쪽부터 빈 칸
    const n = it.kind === 'food' ? Math.min(STACK, count) : 1;
    bag[i] = { id, count: n }; count -= n;
  }
  recalc(); drawBag();
  return count;
}

// 장비는 들고만 있어도 효과: 보관함 전체를 보고 능력치를 다시 계산
function recalc() {
  let atk = 10 + player.bonusAtk, cd = 1000, crit = 0, critMul = 1, maxHp = 100 + player.bonusHp, knock = .35, reach = REACH, speed = SPEED;   // 넉백·베기 범위·이동 속도 기본값   // bonus = 4단계 샘물
  for (const s of bag) {
    if (!s) continue; const it = ITEMS[s.id];
    if (it.kind === 'weapon') { atk += it.atk; cd *= .7; crit += it.crit; critMul *= it.critMul; }
    knock += it.knock || 0; reach += it.range || 0;                        // 넉백·범위 (무기·장신구, 겹침)
    if (it.speed) speed = Math.max(speed, SPEED * it.speed);                 // 신발은 겹치지 않는다: 가장 빠른 것 하나만
    if (it.kind === 'armor') maxHp += it.hp;
  }
  Object.assign(player, { atk, cd, crit: Math.min(1, crit), critMul, maxHp, hp: Math.min(player.hp, maxHp), knock, reach, speed });
  drawHud(); drawStats();
}
// 손에 드는 무기: 공격력이 가장 높은 무기 (없으면 기본 녹슨 검)
function heldWeapon() {
  let best = null;
  for (const s of bag) if (s && ITEMS[s.id].kind === 'weapon' && (!best || ITEMS[s.id].atk > best.atk)) best = ITEMS[s.id];
  return best || ITEMS.rusty_sword;
}

// 음식 먹기 (숫자 키)
function eat(i) {
  const s = bag[i];
  if (!s) return say(`${(i + 1) % 10}번 칸이 비어 있다`, hero.x, hero.y - 1, '#a3948b');
  const it = ITEMS[s.id];
  if (it.kind !== 'food') return say('장비는 들고만 있어도 효과가 있다', hero.x, hero.y - 1, '#a3948b');
  if (performance.now() - lastEat < EAT_CD) return say('아직 먹을 수 없다', hero.x, hero.y - 1, '#a3948b');
  if (player.hp >= player.maxHp) return say('체력이 가득 찼다', hero.x, hero.y - 1, '#a3948b');
  const heal = Math.min(it.heal, player.maxHp - player.hp);
  player.hp += heal; say(`+${heal}`, hero.x, hero.y - 1, '#7cc48a');
  lastEat = performance.now();
  if (--s.count === 0) bag[i] = null;
  recalc(); drawBag();
}
document.addEventListener('keydown', e => {
  if (gameOver || e.shiftKey || !/^Digit\d$/.test(e.code)) return;
  eat((+e.code.slice(5) + 9) % 10);                                          // 1→0번 칸, …, 0→9번 칸
});

// 정렬: 같은 음식 합치기 → 무기, 방어구, 음식 순 → 등급 높은 순
function sortBag() {
  const list = bag.filter(Boolean); bag = Array(SLOTS).fill(null);
  const kindRank = { weapon: 0, armor: 1, gear: 2, food: 3 }, tierRank = { legend: 0, rare: 1, common: 2 };
  list.sort((a, b) => { const A = ITEMS[a.id], B = ITEMS[b.id]; return kindRank[A.kind] - kindRank[B.kind] || tierRank[A.tier] - tierRank[B.tier] || A.name.localeCompare(B.name); });
  for (const s of list) addItem(s.id, s.count);                             // 다시 넣으면서 음식이 합쳐진다
}

// ----- 바닥에 놓인 아이템 (방을 나가면 사라짐) -----
// 주인공 둘레에서 비어 있는 바닥 칸 하나
function freeCellNear(x, y) {
  for (let r = 1; r <= 3; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (isFloor(nx, ny) && !here.blocked.has(key(nx, ny)) && !(here.floorItems || []).some(f => f.x === nx && f.y === ny)) return [nx, ny];
  }
  return null;
}
function dropToFloor(id, count, x, y) {
  const c = freeCellNear(Math.round(x), Math.round(y)); if (!c) return false;
  (here.floorItems = here.floorItems || []).push({ id, count, x: c[0], y: c[1], at: performance.now() });
  return true;
}
// 아이템 칸에 들어서면 줍는다
function pickUp() {
  const list = here.floorItems || [];
  for (const f of list) {
    if (Math.hypot(f.x - hero.x, f.y - hero.y) > .3 || performance.now() - f.at < 300) continue;
    const left = addItem(f.id, f.count);
    if (left === f.count) { if (!f.fullMsg) say('보관함이 가득 찼다', hero.x, hero.y - 1, '#ff6b6b'); f.fullMsg = true; continue; }
    say(`${ITEMS[f.id].name}${f.count - left > 1 ? ' ×' + (f.count - left) : ''}`, f.x, f.y - 1, '#f0c040');
    f.count = left;
  }
  here.floorItems = list.filter(f => f.count > 0);
  for (const f of here.floorItems) if (Math.hypot(f.x - hero.x, f.y - hero.y) > .6) f.fullMsg = false;
}

// ----- 상자에서 나오는 아이템 -----
function weighted(table) { const r = Math.random() * Object.values(table).reduce((a, b) => a + b, 0); let acc = 0; for (const [k, v] of Object.entries(table)) { acc += v; if (r < acc) return k; } }
function rollLoot() {
  const L = DESIGN.loot; if (Math.random() > L.itemChance) return null;
  const kind = weighted(L.kind);
  if (kind === 'food') { const id = weighted({ apple: 50, cheese: 35, potion: 15 }); const [a, b] = L.foodCount[id]; return { id, count: a + Math.floor(Math.random() * (b - a + 1)) }; }
  // 층이 깊을수록 좋은 등급이 잘 나온다
  const tierW = { ...L.tier }; tierW.rare *= 1 + (floorNo - 1) * .3; tierW.legend *= 1 + (floorNo - 1) * .5;
  let tier = weighted(tierW), pool;
  pool = DESIGN.items.filter(it => it.kind === kind && it.tier === tier && !it.shop);   // 상인 전용은 상자에서 안 나옴
  if (!pool.length) pool = DESIGN.items.filter(it => it.kind === kind && !it.shop);      // 그 등급이 없으면 아무 등급이나
  return { id: pick(pool).id, count: 1 };
}

// ----- 아이템 그림 -----
const itemImgName = it => it.n;
function itemHtml(it) {
  if (!it.n) return `<span class="emo">${it.emoji}</span>`;
  return `<img src="${img(it.n).src}" alt="" style="${it.tint ? 'filter:' + it.tint : ''}">`;
}
function drawItemOnFloor(c, f, t) {
  // 5단계: 보스 보상은 보스 자리에서 포물선을 그리며 날아간다
  let fx = f.x, fy = f.y, lift = 0;
  if (f.from && t < f.at) { const k = 1 - (f.at - t) / 600; fx = f.from[0] + (f.x - f.from[0]) * k; fy = f.from[1] + (f.y - f.from[1]) * k; lift = Math.sin(k * Math.PI) * 24; }
  const it = ITEMS[f.id], bob = Math.sin(t / 300 + f.x) * 1.5, cx = (fx + .5) * T, cy = (fy + OY + .5) * T + bob - lift;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(cx, (fy + OY + .85) * T, 5, 2, 0, 0, Math.PI * 2); c.fill();
  if (!it.n) { c.font = '11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(it.emoji, cx, cy); c.textBaseline = 'alphabetic'; return; }
  const i = img(it.n); if (!i.naturalWidth) return;
  const s = Math.min(1, 14 / i.naturalHeight), w = i.naturalWidth * s, h = i.naturalHeight * s;
  if (it.tint) c.filter = it.tint;
  c.drawImage(i, cx - w / 2, cy - h / 2, w, h); c.filter = 'none';
}

// ----- 보관함 화면 -----
const bagEl = document.getElementById('bag'), tipEl = document.getElementById('tip');
let dragFrom = null;
function drawBag() {
  bagEl.innerHTML = bag.map((s, i) => {
    const it = s && ITEMS[s.id];
    // 음식 칸에는 먹기 쿨타임 게이지 (CSS 애니메이션, 이미 지난 시간만큼 앞당겨 시작)
    const left = EAT_CD - (performance.now() - lastEat);
    const gauge = it && it.kind === 'food' && left > 0 ? `<i class="eatcd" style="--d:-${EAT_CD - left}ms"></i>` : '';
    return `<div class="slot ${it ? 't-' + it.tier : ''}" data-i="${i}" draggable="${!!it}"><span class="num">${(i + 1) % 10}</span>${it ? itemHtml(it) + (s.count > 1 ? `<span class="cnt">${s.count}</span>` : '') : ''}${gauge}</div>`;
  }).join('') + '<button class="sort" id="sortBtn">정렬</button>';
  document.getElementById('sortBtn').onclick = sortBag;
  bagEl.querySelectorAll('.slot').forEach(el => {
    const i = +el.dataset.i;
    el.ondragstart = e => { dragFrom = i; e.dataTransfer.setData('text', i); hideTip(); };
    el.ondragover = e => e.preventDefault();
    el.ondrop = e => { e.preventDefault(); e.stopPropagation(); if (dragFrom == null) return; [bag[dragFrom], bag[i]] = [bag[i], bag[dragFrom]]; dragFrom = null; drawBag(); };
    el.onmouseenter = () => showTip(el, bag[i]); el.onmouseleave = hideTip;
  });
}
// 보관함 바깥에 놓으면 바닥에 버린다
document.addEventListener('dragover', e => { if (dragFrom != null) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (dragFrom == null || e.target.closest('#bag')) return;
  e.preventDefault();
  const s = bag[dragFrom];
  if (dropToFloor(s.id, s.count, hero.x, hero.y)) { bag[dragFrom] = null; say(`${ITEMS[s.id].name}을(를) 버렸다`, hero.x, hero.y - 1, '#a3948b'); recalc(); drawBag(); }
  dragFrom = null;
});
function showTip(el, s) {
  if (!s) return hideTip();
  const it = ITEMS[s.id], r = el.getBoundingClientRect();
  const fx = fxText(it);
  tipEl.innerHTML = `<b style="color:${DESIGN.ui.inv.rarity[it.tier]}">${it.name}</b> <span class="dim">${TIER_NAME[it.tier]} ${KIND_NAME[it.kind]}</span><br>${fx}<br><span class="dim">${it.kind === 'food' ? '숫자 키로 1개 먹기' : '들고 있으면 효과'}</span>`;
  tipEl.style.display = 'block';
  tipEl.style.left = r.left + window.scrollX + 'px'; tipEl.style.top = r.top + window.scrollY - tipEl.offsetHeight - 8 + 'px';
}
function hideTip() { tipEl.style.display = 'none'; }
// 테스트용: 지금 능력치
function drawStats() {
  const el = document.getElementById('stats'); if (!el) return;
  el.textContent = `공격력 ${player.atk} · 쿨타임 ${(player.cd / 1000).toFixed(2)}초 · 치명타 ${Math.round(player.crit * 100)}% ×${player.critMul.toFixed(2)} · 최대 체력 ${player.maxHp} · 넉백 ${player.knock.toFixed(2)}칸 · 베기 범위 ${player.reach.toFixed(1)}칸 · 이동 ${player.speed.toFixed(1)}칸/초`;

// 테스트용 키: I = 무작위 아이템, F = 사과 50개
document.addEventListener('keydown', e => {

  if (k === 'f') { const left = addItem('apple', 50); say(left ? `사과 ${left}개는 자리가 없다` : '+ 사과 ×50', hero.x, hero.y - 1, '#f0c040'); }
});

// =====================================================================
// 4단계: 방 종류 (보상 방·상인 방)
//   보상 방: 잠기지 않은 상자, 또는 샘물(1회용: 체력 회복 / 최대 체력↑ / 공격력↑)
//   상인 방: 음식과, 상자에서는 안 나오는 장비를 판다. 보관함 물건을 반값에 산다
// =====================================================================
const RR = DESIGN.rooms_rule;

// 새 방의 종류 정하기 (시작 방과 보스 방은 던전 만들기에서 따로 정함)
function pickRoomType(count) {
  const types = Object.values(rooms).map(r => r.type);
  // 상인은 층마다 1명: 보스 바로 전 방까지 안 나왔으면 거기서 반드시
  if (!types.includes('shop') && (count === N - 1 || Math.random() < .2)) return 'shop';
  if (types.filter(t => t === 'reward').length < RR.rewardMax && Math.random() < RR.rewardChance) return 'reward';
  return 'combat';
}

// ----- 보상 방 -----
const FOUNTAIN_FX = {
  heal:  { text: '체력이 모두 회복됐다', use() { player.hp = player.maxHp; } },
  maxhp: { text: `최대 체력 +${RR.fountain.maxhp}`, use() { player.bonusHp += RR.fountain.maxhp; recalc(); player.hp += RR.fountain.maxhp; } },
  atk:   { text: `공격력 +${RR.fountain.atk}`, use() { player.bonusAtk += RR.fountain.atk; recalc(); } },
};
function setupReward(room) {
  const L = room.layout, hasFountain = L.wall.some(w => w.k.startsWith('fountain'));
  const fountain = hasFountain && Math.random() < .5;                       // 반반: 상자 방 / 샘물 방
  room.layout = {                                                             // 틀을 복사해서 한쪽만 남긴다
    decor: fountain ? L.decor.filter(o => o.k !== 'chest') : L.decor,
    wall: fountain ? L.wall : L.wall.filter(w => !w.k.startsWith('fountain')),
  };
  room.variant = 'reward'; room.state = 'clear';
  const c = room.layout.decor.find(o => o.k === 'chest');
  room.chest = c ? { x: c.x, y: c.y, opened: false, openAt: 0 } : null;
  room.fountains = room.layout.wall.filter(w => w.k.startsWith('fountain')).map(w => ({ x: w.x, used: false, fx: pick(Object.keys(FOUNTAIN_FX)) }));
  room.blocked = blockedCells(room);
}
// 샘물 받침(벽 바로 아래 칸) 옆에 서면 한 번 쓴다
function checkFountains(room) {
  for (const f of room.fountains || []) {
    if (f.used || Math.abs(hero.x - f.x) > 1 || Math.abs(hero.y - 2) > 1) continue;
    f.used = true; FOUNTAIN_FX[f.fx].use(); drawHud();
    say(FOUNTAIN_FX[f.fx].text, f.x, 1, '#7fe8ff');
  }
}

// ----- 상인 방 -----
function setupShop(room) {
  room.state = 'clear';
  const shopOnly = kind => DESIGN.items.filter(it => it.shop && it.kind === kind).sort(() => Math.random() - .5).slice(0, 2);
  room.stock = [...shopOnly('weapon'), ...shopOnly('armor')].map(it => ({ id: it.id, sold: false }));   // 무기 2종, 방어구 2종
  room.blocked = blockedCells(room);
}
const FOODS = DESIGN.items.filter(it => it.kind === 'food');               // 음식은 얼마든지 판다
const sellPrice = it => Math.floor(it.price / 2);
let shopOpen = false, shopTab = 'buy', shopAway = true;

// 상인 옆에 오면 창이 열리고, 멀어지면 닫힌다 (Esc로도 닫기)
function checkMerchant(room) {
  const m = room.type === 'shop' && room.layout.decor.find(o => o.k === 'merchant');
  const near = m && Math.max(Math.abs(hero.x - m.x), Math.abs(hero.y - m.y)) <= 1.5;
  if (near && shopAway) { shopAway = false; shopOpen = true; shopTab = 'buy'; drawShop(); }
  if (!near && !shopAway) { shopAway = true; if (shopOpen) { shopOpen = false; drawShop(); } }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && shopOpen) { shopOpen = false; drawShop(); } });

function itemFx(it) { return fxText(it); }
function drawShop() {
  const el = document.getElementById('shop');
  el.style.display = shopOpen ? 'flex' : 'none'; if (!shopOpen) return;
  const row = (it, price, label, act, extra = '') => `<div class="row"><span class="ico">${itemHtml(it)}</span>
    <span class="nm"><b style="color:${DESIGN.ui.inv.rarity[it.tier]}">${it.name}</b>${extra}<br><small>${itemFx(it)}</small></span>
    <span class="pr">💰 ${price}</span><button data-act="${act}" ${label === '사기' && player.gold < price ? 'disabled' : ''}>${label}</button></div>`;
  let rows;
  if (shopTab === 'buy') rows = [...FOODS.map(it => row(it, it.price, '사기', 'f:' + it.id)),
    ...here.stock.map((s, i) => s.sold ? '' : row(ITEMS[s.id], ITEMS[s.id].price, '사기', 's:' + i, ' <small class="only">상인 전용</small>'))].join('');
  else rows = bag.map((s, i) => s ? row(ITEMS[s.id], sellPrice(ITEMS[s.id]), '팔기', 'b:' + i, s.count > 1 ? ` ×${s.count}` : '') : '').join('') || '<p class="empty">팔 물건이 없다</p>';
  el.innerHTML = `<div class="panel"><header><b>🧔 상인</b><span>💰 ${player.gold}</span>
      <button data-tab="buy" class="${shopTab === 'buy' ? 'on' : ''}">사기</button><button data-tab="sell" class="${shopTab === 'sell' ? 'on' : ''}">팔기 (반값)</button>
      <button data-act="close">✕</button></header><div class="list">${rows}</div><footer>멀어지거나 Esc를 누르면 닫힙니다</footer></div>`;
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { shopTab = b.dataset.tab; drawShop(); });
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => shopAct(b.dataset.act));
}
function shopAct(act) {
  if (act === 'close') { shopOpen = false; return drawShop(); }
  const [kind, v] = act.split(':');
  if (kind === 'b') {                                                         // 팔기: 음식은 1개씩
    const s = bag[+v], it = ITEMS[s.id];
    player.gold += sellPrice(it);
    if (--s.count === 0) bag[+v] = null;
    say(`+${sellPrice(it)} 금화`, hero.x, hero.y - 1, '#f0c040');
  } else {                                                                    // 사기
    const id = kind === 'f' ? v : here.stock[+v].id, it = ITEMS[id];
    if (player.gold < it.price) return;
    if (addItem(id, 1) > 0) { say('보관함이 가득 찼다', hero.x, hero.y - 1, '#ff6b6b'); return drawShop(); }
    player.gold -= it.price;
    if (kind === 's') here.stock[+v].sold = true;
    say(`${it.name} 샀다`, hero.x, hero.y - 1, '#f0c040');
  }
  recalc(); drawBag(); drawHud(); drawShop();
}

// 테스트용 키: $ = 금화 +100
document.addEventListener('keydown', e => {
  if (!DEBUG || e.key !== '$') return;
  player.gold += 100; drawHud(); if (shopOpen) drawShop(); say('+100 금화', hero.x, hero.y - 1, '#f0c040');

// =====================================================================
// 5단계: 보스와 다음 층
//   층마다 다른 보스와 공격 세트 (design.js의 boss.bosses)
//   공격 종류: 원형 장판 / 체크 격자 장판 / 돌진 / 방사형 / 부채꼴 / 일직선 연사 / 느린 유도탄 / 나선 탄막 /
//             졸개 소환(근접·원거리) / 몸통 충돌 — 몸통 충돌 말고는 모두 쏘기·터지기 전에 예고가 나온다
//   체력 절반 이하면 2페이즈: 돌진 3연속, 장판·발사체가 더 많아짐
//   처치하면 보상이 조금 떨어진 바닥에 떨어지고, 계단으로 다음 층
// =====================================================================
const BP = DESIGN.boss;
let banner = null;                                    // 화면 가운데 큰 글씨 { text, at }
const phaseVal = (e, pair) => pair[e.phase - 1];      // [1페이즈 값, 2페이즈 값]
// 2페이즈(분노): 0.6초에 걸쳐 덩치가 rageScale배로 커지고, 처음 1.2초는 빠르게, 그 뒤로는 가끔 붉게 깜빡인다
const RED_FILTER = 'sepia(1) saturate(6) hue-rotate(-45deg) brightness(1.05)';
const bossScale = (e, t) => e.phase === 2 ? 1 + (BP.rageScale - 1) * Math.min(1, (t - e.rageAt) / 600) : 1;
const redBlink = (e, t) => t - e.rageAt < 1200 ? Math.floor((t - e.rageAt) / 90) % 2 === 0 : Math.floor(t / 250) % 4 === 0;

// 층마다 다른 보스: design.js의 boss.bosses 목록을 차례대로 (끝나면 처음부터, 능력치는 계속 오름)
function setupBoss(room) {
  room.variant = 'boss'; room.blocked = blockedCells(room); room.stairsOpen = false;
  const spot = room.layout.decor.find(o => o.k === 'boss') || { x: 8, y: 5 };
  const def = BP.bosses[(floorNo - 1) % BP.bosses.length];
  const e = makeEnemy(def.id, spot.x + .5, spot.y);   // 큰 그림이라 두 칸 가운데에 선다
  const p = power();                                  // 보스 체력·공격력은 그림과 상관없이 층에 따라 오른다
  e.hp = e.maxHp = Math.round(BP.hp * p.hp); e.atk = Math.round(BP.atk * p.atk);
  Object.assign(e, { boss: true, name: def.name, tint: def.tint, acts: def.acts, phase: 1, act: null,
    wakeAt: performance.now() + BP.introMs, next: performance.now() + BP.introMs + 600 });
  room.enemies = [e];
  lockRoom(room, true);
  banner = { text: `⚠ ${e.name} ⚠`, at: performance.now() };
}

// ----- 보스의 행동 -----
function updateBoss(room, dt, t) {
  for (const e of room.enemies || []) {
    if (!e.boss || t < e.wakeAt) continue;
    if (e.phase === 1 && e.hp <= e.maxHp / 2) { e.phase = 2; e.rageAt = t; banner = { text: '분노했다!', at: t }; e.next = Math.max(e.next, t + 1200); }
    const dist = Math.hypot(hero.x - e.x, hero.y - e.y);
    if (!e.act) {
      // 공격 사이에는 천천히 다가온다
      e.moving = dist > 1.5;
      if (e.moving) { const nx = e.x + (hero.x - e.x) / dist * e.m.spd * BP.walkSpeed * dt, ny = e.y + (hero.y - e.y) / dist * e.m.spd * BP.walkSpeed * dt; if (walkable(room, Math.round(nx), Math.round(ny), true)) { e.x = nx; e.y = ny; } }
      if (hero.x !== e.x) e.face = Math.sign(hero.x - e.x);
      if (t >= e.next) e.act = startAct(e, t);
    } else runAct(room, e, dt, t);
    if (dist < 1.1 * bossScale(e, t)) hurt(e.atk, t);                       // 몸통 충돌 (커지면 판정도 커진다)
  }
}

const aimAt = e => Math.atan2(hero.y - e.y, hero.x - e.x);
// 그 방향으로 벽·기둥에 닿기 전까지 몇 칸 갈 수 있는지 (돌진·일직선 경고선 길이)
function dashLength(room, e, dir) {
  let d = 0; while (d < 18 && walkable(room, Math.round(e.x + Math.cos(dir) * (d + .25)), Math.round(e.y + Math.sin(dir) * (d + .25)), true)) d += .25;
  return d;
}
function bossShot(e, ang, speed, color, more = {}) { shots.push({ x: e.x, y: e.y - .3, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, atk: Math.round(e.atk * .7), color, r: 3.5, ...more }); }
function endAct(e, t) { e.act = null; e.next = t + phaseVal(e, BP.gapMs); }

// 공격 고르기: 그 보스가 가진 패턴 중에서 (같은 공격 연속 금지, 졸개가 가득하면 소환 안 함)
function startAct(e, t) {
  const minions = here.enemies.length - 1;
  const kinds = e.acts.filter(k => k !== e.lastAct && !(k.startsWith('summon') && minions >= BP.summon.max));
  const kind = pick(kinds.length ? kinds : e.acts.filter(k => !k.startsWith('summon'))); e.lastAct = kind;
  const a = { kind, at: t };
  if (kind === 'zone') {                                                     // 주인공 자리 + 둘레에 원형 장판
    a.zones = [[hero.x, hero.y]];
    for (let i = 1; i < phaseVal(e, BP.zone.count); i++) a.zones.push([Math.max(1, Math.min(16, hero.x + (Math.random() - .5) * 7)), Math.max(2, Math.min(11, hero.y + (Math.random() - .5) * 6))]);
  }
  if (kind === 'checker') { a.parity = Math.random() < .5 ? 0 : 1; a.waves = phaseVal(e, BP.checker.waves); a.wave = 0; }   // 체크 격자 장판
  if (kind === 'charge') { a.dir = aimAt(e); a.len = dashLength(here, e, a.dir); a.left = phaseVal(e, BP.charge.count); a.stage = 'warn'; }
  if (kind === 'radial') { a.waves = phaseVal(e, BP.radial.waves); a.fired = 0; a.warn = BP.radial.warnMs; }
  if (kind === 'aimed') { a.bursts = BP.aimed.bursts; a.fired = 0; a.warn = BP.aimed.warnMs; a.base = aimAt(e); }   // 예고한 방향 그대로 쏜다
  if (kind === 'beam') {                                                     // 일직선 연사: 줄마다 방향을 미리 정해 둔다
    const n = phaseVal(e, BP.beam.lines), base = aimAt(e);
    a.dirs = Array.from({ length: n }, (_, i) => base + (i - (n - 1) / 2) * .5);
    a.lens = a.dirs.map(d => dashLength(here, e, d)); a.fired = 0; a.warn = BP.beam.warnMs;
  }
  if (kind === 'homing') { a.fired = 0; a.warn = BP.homing.warnMs; }
  if (kind === 'spiral') { a.fired = 0; a.warn = BP.spiral.warnMs; a.start = Math.random() * Math.PI * 2; a.spin = Math.random() < .5 ? 1 : -1; }
  if (kind.startsWith('summon')) {                                           // 보스 둘레 2~4칸의 빈 바닥에 마법진
    const P = BP[kind], free = [];
    for (let y = 2; y <= 11; y++) for (let x = 1; x <= 16; x++) { const d = Math.hypot(x - e.x, y - e.y); if (d >= 2 && d <= 4 && walkable(here, x, y, true) && Math.hypot(x - hero.x, y - hero.y) > 2) free.push([x, y]); }
    a.ids = P.ids; a.color = P.color;
    a.spots = free.sort(() => Math.random() - .5).slice(0, Math.min(phaseVal(e, P.count), BP.summon.max - minions));
  }
  return a;
}

function runAct(room, e, dt, t) {
  const a = e.act, el = t - a.at;
  if (a.kind === 'zone') {
    if (el >= BP.zone.warnMs && !a.boom) {                                   // 경고가 끝나면 터진다
      a.boom = t;
      for (const [x, y] of a.zones) if (Math.hypot(hero.x - x, hero.y - y) < BP.zone.radius) hurt(e.atk, t);
    }
    if (el >= BP.zone.warnMs + 250) endAct(e, t);
  } else if (a.kind === 'checker') {
    // 바닥 전체의 체크무늬 칸 중 한쪽 색이 터진다. 2페이즈는 곧바로 반대쪽 색도 터진다
    const wl = el - a.wave * (BP.checker.warnMs + 200);
    if (wl >= BP.checker.warnMs && a.boomWave !== a.wave) {
      a.boomWave = a.wave; a.boom = t;
      if ((Math.round(hero.x) + Math.round(hero.y)) % 2 === (a.parity + a.wave) % 2) hurt(e.atk, t);
    }
    if (wl >= BP.checker.warnMs + 200) { if (++a.wave >= a.waves) endAct(e, t); }
  } else if (a.kind === 'charge') {
    if (a.stage === 'warn') { if (el >= BP.charge.warnMs) { a.stage = 'dash'; a.at = t; } }
    else if (a.stage === 'dash') {
      e.moving = true; e.face = Math.cos(a.dir) >= 0 ? 1 : -1;
      const nx = e.x + Math.cos(a.dir) * BP.charge.speed * dt, ny = e.y + Math.sin(a.dir) * BP.charge.speed * dt;
      if (walkable(room, Math.round(nx), Math.round(ny), true) && el < 1500) { e.x = nx; e.y = ny; }
      else { a.stage = 'rest'; a.at = t; a.left--; }                         // 벽에 부딪히면 멈춘다
    } else if (el >= 350) {
      if (a.left > 0) { a.stage = 'warn'; a.at = t; a.dir = aimAt(e); a.len = dashLength(room, e, a.dir); } else endAct(e, t);
    }
  } else if (a.kind === 'radial') {
    if (a.fired < a.waves && el >= a.warn + a.fired * 350) {               // 예고(warn)가 끝난 뒤 발사
      const n = phaseVal(e, BP.radial.count), off = a.fired * Math.PI / n;    // 두 번째 물결은 사이사이로
      for (let i = 0; i < n; i++) bossShot(e, off + i * Math.PI * 2 / n, BP.radial.speed, '#ff5a5a');
      a.fired++;
    }
    if (el >= a.warn + a.waves * 350 + 300) endAct(e, t);
  } else if (a.kind === 'aimed') {
    if (a.fired < a.bursts && el >= a.warn + a.fired * 260) {
      const n = phaseVal(e, BP.aimed.shots);
      for (let i = 0; i < n; i++) bossShot(e, a.base + (i - (n - 1) / 2) * .16, BP.aimed.speed, '#ffb347');
      a.fired++;
    }
    if (el >= a.warn + a.bursts * 260 + 300) endAct(e, t);
  } else if (a.kind === 'beam') {                                            // 예고한 줄을 따라 빠른 탄을 줄줄이
    const n = phaseVal(e, BP.beam.shots);
    while (a.fired < n && el >= a.warn + a.fired * BP.beam.gapMs) { for (const d of a.dirs) bossShot(e, d, BP.beam.speed, '#9fe8ff', { r: 2.5 }); a.fired++; }
    if (el >= a.warn + n * BP.beam.gapMs + 300) endAct(e, t);
  } else if (a.kind === 'homing') {                                          // 느린 유도탄: 따라오지만 잘 못 꺾는다
    const n = phaseVal(e, BP.homing.shots);
    while (a.fired < n && el >= a.warn + a.fired * BP.homing.gapMs) { bossShot(e, aimAt(e) + (Math.random() - .5) * .6, BP.homing.speed, '#d07bff', { turn: BP.homing.turn, until: t + BP.homing.lifeMs, r: 4 }); a.fired++; }
    if (el >= a.warn + n * BP.homing.gapMs + 300) endAct(e, t);
  } else if (a.kind === 'spiral') {                                          // 나선 탄막: 돌아가며 쏜다
    const n = phaseVal(e, BP.spiral.shots), arms = phaseVal(e, BP.spiral.arms);
    while (a.fired < n && el >= a.warn + a.fired * BP.spiral.gapMs) {
      for (let k = 0; k < arms; k++) bossShot(e, a.start + a.spin * a.fired * BP.spiral.turnStep + k * Math.PI * 2 / arms, BP.spiral.speed, '#ff7ad9', { r: 3 });
      a.fired++;
    }
    if (el >= a.warn + n * BP.spiral.gapMs + 300) endAct(e, t);
  } else if (a.kind.startsWith('summon')) {
    if (el >= BP.summon.warnMs && !a.done) {                                 // 마법진에서 졸개 등장
      a.done = true;
      for (const [x, y] of a.spots) { const m = makeEnemy(pick(a.ids), x, y); m.wakeAt = t + 300; m.minion = true; room.enemies.push(m); say('💨', x, y, a.color); }
    }
    if (el >= BP.summon.warnMs + 300) endAct(e, t);
  }
}

// ----- 경고(예고) 표시: 바닥 위, 다른 모든 것 아래에 그린다 -----
function drawBossWarnings(t) {
  for (const e of here.enemies || []) {
    const a = e.boss && e.act; if (!a) continue;
    const el = t - a.at, bx = (e.x + .5) * T, by = (e.y + OY + .5) * T;
    const glow = (rgb) => { ctx.fillStyle = `rgba(${rgb},${.25 + .25 * Math.sin(el / 40)})`; ctx.beginPath(); ctx.arc(bx, by - 6, 14, 0, Math.PI * 2); ctx.fill(); };
    const ray = (ang, len, rgb, alpha, width = 1) => { ctx.strokeStyle = `rgba(${rgb},${alpha})`; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(bx, by - 4); ctx.lineTo(bx + Math.cos(ang) * len, by - 4 + Math.sin(ang) * len); ctx.stroke(); };
    if (a.kind === 'zone') for (const [x, y] of a.zones) {
      const cx = (x + .5) * T, cy = (y + OY + .5) * T, r = BP.zone.radius * T;
      if (!a.boom) {                                                         // 빨간 장판 + 안쪽에서 차오르는 원
        const k = Math.min(1, el / BP.zone.warnMs);
        ctx.fillStyle = 'rgba(255,40,40,.22)'; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * .7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,60,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy, r * k, r * .7 * k, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,80,80,.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * .7, 0, 0, Math.PI * 2); ctx.stroke();
      } else {                                                               // 터지는 빛
        const k = Math.min(1, (t - a.boom) / 250);
        ctx.fillStyle = `rgba(255,220,120,${.8 * (1 - k)})`; ctx.beginPath(); ctx.ellipse(cx, cy, r * (1 + k * .3), r * .7 * (1 + k * .3), 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (a.kind === 'checker') {
      const wl = el - a.wave * (BP.checker.warnMs + 200), parity = (a.parity + a.wave) % 2, k = Math.min(1, Math.max(0, wl) / BP.checker.warnMs);
      const booming = a.boomWave === a.wave && t - a.boom < 200;
      for (let y = 2; y <= 11; y++) for (let x = 1; x <= 16; x++) if ((x + y) % 2 === parity) {
        ctx.fillStyle = booming ? `rgba(255,220,120,${.7 * (1 - (t - a.boom) / 200)})` : `rgba(255,50,50,${.12 + .28 * k})`;
        ctx.fillRect(x * T + 1, (y + OY) * T + 1, T - 2, T - 2);
      }
    }
    if (a.kind === 'charge' && a.stage === 'warn') {                         // 돌진할 방향의 빨간 띠 (멈출 벽까지만)
      const k = Math.min(1, el / BP.charge.warnMs), L = ((a.len ?? 18) + .7) * T;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(a.dir);
      ctx.fillStyle = 'rgba(255,40,40,.18)'; ctx.fillRect(0, -T * .7, L, T * 1.4);
      ctx.fillStyle = 'rgba(255,60,60,.35)'; ctx.fillRect(0, -T * .7, L * k, T * 1.4);
      ctx.restore();
    }
    if (a.warn && el < a.warn) {                                             // 쏘기 전 예고
      const k = el / a.warn;
      if (a.kind === 'radial') { glow('255,90,90'); const n = phaseVal(e, BP.radial.count); for (let i = 0; i < n; i++) ray(i * Math.PI * 2 / n, 2.5 * T * k, '255,90,90', .35 + .4 * k); }
      if (a.kind === 'aimed') { glow('255,180,70'); const n = phaseVal(e, BP.aimed.shots); for (let i = 0; i < n; i++) ray(a.base + (i - (n - 1) / 2) * .16, 6 * T * k, '255,180,70', .35 + .4 * k); }
      if (a.kind === 'beam') { glow('150,230,255'); a.dirs.forEach((d, i) => ray(d, (a.lens[i] + .5) * T, '150,230,255', .25 + .6 * k, 1 + 2 * k)); }
      if (a.kind === 'homing') { glow('200,120,255'); for (let i = 0; i < 3; i++) { const ang = el / 150 + i * 2.1; ctx.fillStyle = 'rgba(210,130,255,.8)'; ctx.beginPath(); ctx.arc(bx + Math.cos(ang) * 12, by - 6 + Math.sin(ang) * 8, 2.5 * k + 1, 0, Math.PI * 2); ctx.fill(); } }
      if (a.kind === 'spiral') { glow('255,120,220'); const arms = phaseVal(e, BP.spiral.arms); for (let i = 0; i < arms; i++) ray(a.start + i * Math.PI * 2 / arms - a.spin * (1 - k) * 2, 3 * T, '255,120,220', .3 + .5 * k, 2); }
    }
    if (a.kind.startsWith('summon') && !a.done) for (const [x, y] of a.spots) {   // 소환 예고: 마법진이 빙글빙글
      const cx = (x + .5) * T, cy = (y + OY + .6) * T, k = Math.min(1, el / BP.summon.warnMs), rgb = a.color === '#ffb347' ? '255,170,70' : '190,120,255';
      ctx.strokeStyle = `rgba(${rgb},${.4 + .5 * k})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(cx, cy, 7, 4, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, 7, 4, 0, el / 120, el / 120 + Math.PI * 2 * k); ctx.stroke();
      ctx.fillStyle = `rgba(${rgb},${.25 * k})`; ctx.beginPath(); ctx.ellipse(cx, cy, 7 * k, 4 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}
// 보스 체력 막대 (화면 위쪽)
function drawBossBar() {
  const e = (here.enemies || []).find(e => e.boss); if (!e) return;
  const w = 140, x = (screen.width - w) / 2, y = 6;
  ctx.fillStyle = '#000c'; ctx.fillRect(x - 2, y - 2, w + 4, 9);
  ctx.fillStyle = e.phase === 2 ? '#ff3030' : '#c8282e'; ctx.fillRect(x, y, w * Math.max(0, e.hp) / e.maxHp, 5);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${e.name}${e.phase === 2 ? ' (분노)' : ''}`, screen.width / 2, y + 14);
}
function drawBanner(t) {
  if (!banner) return; const k = (t - banner.at) / 1600; if (k >= 1) { banner = null; return; }
  ctx.globalAlpha = k < .8 ? 1 : (1 - k) * 5; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#000'; ctx.fillText(banner.text, screen.width / 2 + 1, screen.height * .42 + 1);
  ctx.fillStyle = '#ffd23a'; ctx.fillText(banner.text, screen.width / 2, screen.height * .42); ctx.globalAlpha = 1;
}

// ----- 보스 처치: 보상은 조금 떨어진 바닥으로 날아가고, 계단이 열린다 -----
function bossDefeated(e, t) {
  here.stairsOpen = true;
  for (const m of here.enemies) say('💨', m.x, m.y, '#c9a0ff');              // 남은 졸개도 함께 사라진다
  here.enemies = []; lockRoom(here, false);
  const gold = BP.rewardGold * floorNo; player.gold += gold; drawHud();
  say(`+${gold} 금화`, e.x, e.y - 2, '#f0c040');
  banner = { text: '보스 처치!', at: t };
  // 보스에서 3~4칸 떨어진, 걸어서 갈 수 있는 빈 바닥
  const cells = [];
  for (let y = 2; y <= 11; y++) for (let x = 1; x <= 16; x++) {
    const d = Math.hypot(x - e.x, y - e.y);
    if (d >= 3 && d <= 4.5 && walkable(here, x, y, true) && !here.layout.decor.some(o => o.k === 'stairs' && o.x === x && o.y === y)) cells.push([x, y]);
  }
  const [x, y] = pick(cells) || [8, 8];
  const loot = pick(DESIGN.items.filter(it => it.tier === 'legend' && !it.shop));
  (here.floorItems = here.floorItems || []).push({ id: loot.id, count: 1, x, y, at: t + 600, from: [e.x, e.y] });
}

// 계단을 밟으면 다음 층
function checkStairs() {
  if (!here.stairsOpen) return;
  const s = here.layout.decor.find(o => o.k === 'stairs');
  if (s && Math.round(hero.x) === s.x && Math.round(hero.y) === s.y && !hero.path.length) nextFloor();
}
let floorBusy = false;                                // 층을 넘어가는 중 (화면이 어두워지는 동안 두 번 넘어가지 않게)
function nextFloor() {
  if (floorBusy) return; floorBusy = true;
  const fade = document.getElementById('fade'); fade.style.opacity = 1;
  setTimeout(() => {
    floorBusy = false;
    floorNo++; shots = []; here.floorItems = [];
    newFloor(); here.blocked = here.blocked || blockedCells(here);
    Object.assign(hero, { x: 8, y: 9, path: [] });
    drawHud(); drawMinimap(); fade.style.opacity = 0;
    banner = { text: `${floorNo}층`, at: performance.now() };
  }, 300);
}

// 테스트용 키: B = 지금 방을 보스 방으로, H = 보스 체력 절반, N = 다음 층
document.addEventListener('keydown', e => {
  if (!DEBUG || gameOver) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { here.type = 'boss'; here.layout = pick(DESIGN.rooms.boss); here.chest = null; shots = []; setupBoss(here); drawMinimap(); }
  if (k === 'h') { const b = (here.enemies || []).find(e => e.boss); if (b) b.hp = Math.min(b.hp, Math.floor(b.maxHp / 2)); }
  if (k === 'n') nextFloor();
});

// =====================================================================
// 매 프레임
// =====================================================================
let last = performance.now();
function frame() {
  const t = performance.now();   // 클릭 때 기록한 시각과 같은 시계를 써야 효과가 어긋나지 않는다
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  if (!gameOver) {
    updateAttack(t); updateHero(dt);
    updateEnemies(here, dt, t); updateShots(dt, t); checkChest(here, t); pickUp(); checkFountains(here); checkMerchant(here); updateBoss(here, dt, t); checkStairs();
  }
  const actors = [{ y: -99, draw: () => drawBossWarnings(t) }];       // 5단계: 보스 경고는 바닥 위, 모든 것 아래
  // 주인공 (무적 동안 깜빡임)
  const blink = t - hurtAt < INVULN && Math.floor((t - hurtAt) / DESIGN.ui.blinkMs) % 2 === 1;
  const heroImg = anim(HERO + (hero.moving ? '_run_anim_f' : '_idle_anim_f'), t, 100);
  const sw = swing && t - swing.at < SWING_MS ? (t - swing.at) / SWING_MS : null;   // 휘두르는 중이면 0→1
  if (!blink) actors.push({ y: hero.y, draw: () => { drawFlipped(heroImg, hero.x, hero.y, hero.face); drawWeapon(hero.x, hero.y, sw); } });
  // 적
  for (const e of here.enemies || []) actors.push({ y: e.y, draw: () => {
    // 맞은 순간 하얗게 / 5단계: 색을 바꾼 보스, 2페이즈 붉은 점멸
    const red = e.boss && e.phase === 2 && redBlink(e, t);
    ctx.filter = t - e.hitAt < 120 ? 'brightness(4)' : [e.tint, red ? RED_FILTER : ''].join(' ').trim() || 'none';
    const sc = e.boss ? bossScale(e, t) : 1;                                 // 5단계: 2페이즈 보스는 덩치가 커진다 (발밑 기준)
    if (sc !== 1) { const fx = (e.x + .5) * T, fy = (e.y + OY + 1) * T; ctx.save(); ctx.translate(fx, fy); ctx.scale(sc, sc); ctx.translate(-fx, -fy); }
    drawFlipped(anim(e.moving ? e.m.run : e.m.idle, t + e.x * 37), e.x, e.y, e.face);
    if (sc !== 1) ctx.restore();
    ctx.filter = 'none';
    if (e.hp < e.maxHp && !e.boss) { const x = Math.round(e.x * T + 1), y = Math.round((e.y + OY) * T - 2); ctx.fillStyle = '#000'; ctx.fillRect(x, y, 14, 2); ctx.fillStyle = '#e0484e'; ctx.fillRect(x, y, 14 * e.hp / e.maxHp, 2); }
  } });
  // 바닥에 놓인 아이템
  for (const f of here.floorItems || []) actors.push({ y: f.y - .5, draw: () => drawItemOnFloor(ctx, f, t) });
  // 상자
  const c = here.chest;
  if (c) actors.push({ y: c.y, draw: () => spr(ctx, 'chest_full_open_anim_f' + (c.opened ? Math.min(2, Math.floor((t - c.openAt) / 120)) : 0), c.x, c.y) });
  drawRoom(ctx, here, t, actors);
  // 적의 발사체
  for (const s of shots) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc((s.x + .5) * T, (s.y + OY + .3) * T, s.r || 2.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc((s.x + .5) * T - .7, (s.y + OY + .3) * T - .7, 1, 0, Math.PI * 2); ctx.fill(); }
  // 베기 궤적: 칼끝을 따라가는 하얀 꼬리 + 맞는 범위를 보여 주는 옅은 고리
  if (sw !== null) {
    const cx = (hero.x + .5) * T, cy = (hero.y + OY + .6) * T, a = bladeAngle(sw), d = swing.dir;
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,255,255,${.85 * (1 - sw)})`;
    ctx.beginPath(); ctx.arc(cx, cy, player.reach * T * .75, a - d * 2.2, a, d < 0); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = `rgba(255,240,200,${.35 * (1 - sw)})`;
    ctx.beginPath(); ctx.arc(cx, cy, player.reach * T, 0, Math.PI * 2); ctx.stroke();
  }
  // 맞은 자리에 튀는 불꽃
  sparks = sparks.filter(p => {
    const k = (t - p.at) / 180; if (k >= 1) return false;
    const cx = (p.x + .5) * T, cy = (p.y + OY + .5) * T;
    ctx.strokeStyle = `rgba(255,230,140,${1 - k})`; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + p.at, big = p.big ? 1.8 : 1, r0 = (2 + k * 4) * big, r1 = (4 + k * 8) * big; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke(); }
    return true;
  });
  // 공격 쿨타임 막대 (발밑)
  const cd = Math.min(1, (t - lastAttack) / player.cd);
  if (cd < 1) { const x = Math.round(hero.x * T + 1), y = Math.round((hero.y + OY + 1) * T + 1); ctx.fillStyle = '#000a'; ctx.fillRect(x, y, 14, 2); ctx.fillStyle = '#f0c040'; ctx.fillRect(x, y, 14 * cd, 2); }
  drawFloats(t); drawBossBar(); drawBanner(t);
  if (document.getElementById('debugMap').style.display === 'grid') drawMap(document.getElementById('debugCanvas'), 60, true);
  requestAnimationFrame(frame);
}
// 손에 든 무기: 평소엔 바라보는 쪽 위로 비스듬히 들고, 공격하면 몸 둘레를 한 바퀴 돈다
const WEAPON_IMG = () => heldWeapon().n;                                   // 3단계: 가진 무기 중 가장 센 것
const WEAPON_SCALE = .6;                                                   // 무기 그림이 캐릭터만큼 커서 60%로 줄여 그린다
const SWING_MS = 250;                                                      // 한 바퀴 도는 시간
const restAngle = () => hero.face > 0 ? -.6 : Math.PI + .6;               // 칼끝이 가리키는 방향(라디안)
const bladeAngle = sw => sw === null ? restAngle() : swing.start + swing.dir * Math.PI * 2 * (1 - (1 - sw) ** 2);
function drawWeapon(x, y, sw) {
  const i = img(WEAPON_IMG()); if (!i.naturalWidth) return;
  ctx.save();
  ctx.translate(Math.round((x + .5) * T + (sw === null ? hero.face * 3 : 0)), Math.round((y + OY + .7) * T));
  ctx.rotate(bladeAngle(sw) + Math.PI / 2);                                // 칼날(그림 위쪽)이 그 방향을 보게
  const w = i.naturalWidth * WEAPON_SCALE, h = i.naturalHeight * WEAPON_SCALE;
  ctx.imageSmoothingEnabled = false;                                       // 줄여도 도트가 번지지 않게
  ctx.drawImage(i, -w / 2, -h + (sw === null ? 1 : -4), w, h);             // 휘두를 땐 조금 바깥으로
  ctx.restore();
}
// 바라보는 방향에 맞춰 좌우를 뒤집어 그린다
function drawFlipped(name, x, y, face) {
  ctx.save();
  if (face < 0) { ctx.translate(Math.round((x + .5) * T) * 2, 0); ctx.scale(-1, 1); }
  spr(ctx, name, x, y);
  ctx.restore();
}

// 창 크기에 맞춰 게임 화면 크기를 조절한다 (스크롤 없이 한 화면에 다 보이게)
function fit() {
  const g = document.getElementById('game'), bag = document.getElementById('bag');
  for (let i = 0; i < 3; i++) {                                    // 글 줄바꿈이 바뀔 수 있어 여러 번 맞춘다
    const other = g.offsetHeight - screen.offsetHeight;            // 화면 말고 나머지(HUD, 보관함, 설명)의 높이
    const w = Math.max(320, Math.min(864, innerWidth - 32, (innerHeight - 36 - other) * screen.width / screen.height));
    g.style.width = w + 'px';
    if (bag) bag.style.setProperty('--slot', Math.min(56, Math.floor((w - 90) / 10 - 10)) + 'px');
  }
}
addEventListener('resize', fit);

newFloor();
here.blocked = blockedCells(here);
drawHud(); drawMinimap(); recalc(); drawBag();
fit();
requestAnimationFrame(frame);
</script>
