<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잠긴 페이지</title>
<style>
  :root { --bg: #17110f; --panel: #221a17; --line: #4a3a33; --fg: #ece2d6; --dim: #a8988b; --torch: #f0a04b; --bad: #e0484e; color-scheme: dark }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 "Malgun Gothic", sans-serif; padding: 16px; box-sizing: border-box }
  form { display: grid; gap: 12px; width: min(320px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px }
  h1 { margin: 0; font-size: 22px } p { margin: 0; color: var(--dim); font-size: 14px }
  input, button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg) }
  button { background: var(--torch); color: var(--bg); border: 0; font-weight: 700; cursor: pointer }
  #msg { color: var(--bad); min-height: 1.6em }
</style>
</head>
<body>
<form id="f">
  <h1>🔒 잠긴 페이지</h1>
  <p>선생님이 알려 준 비밀번호를 입력하세요.</p>
  <label for="pw" hidden>비밀번호</label>
  <input id="pw" type="password" autocomplete="off" autofocus>
  <button>열기</button>
  <p id="msg"></p>
</form>

const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(P.s), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(P.i) }, key, bin(P.d)));
  try { sessionStorage.setItem('class-pw', pw); } catch {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  unlock(document.getElementById('pw').value).catch(() => { document.getElementById('msg').textContent = '비밀번호가 틀렸습니다.'; });
};
let saved = null; try { saved = sessionStorage.getItem('class-pw'); } catch {}
if (saved) unlock(saved).catch(() => {});
})();
