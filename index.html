<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 게임 만들기 수업</title>
<style>
  :root { --bg: #17110f; --fg: #ece2d6; --dim: #a8988b; color-scheme: dark }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.7 "Malgun Gothic", sans-serif; padding: 16px; box-sizing: border-box; text-align: center }
  h1 { margin: 0 0 8px } p { color: var(--dim); margin: 0 }
</style>
</head>
<body>
<main><h1>HTML 게임 만들기 수업</h1><p>수업 자료는 수업 시간에 공개됩니다.</p></main>
</body>
</html>
